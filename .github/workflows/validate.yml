name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev requirements (JSON Schema validation)
        run: python -m pip install -r requirements-dev.txt
      - name: Repository validator
        run: python tools/validate_repository.py
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end demo must reproduce the documented behaviour
        run: bash examples/demo.sh > /tmp/demo.txt && grep -q "GATE: BLOCKED" /tmp/demo.txt && grep -q "LEDGER: FAIL" /tmp/demo.txt
